# Continuous integration: the part of the pipeline that runs without ROOT.
#
#   unit tests  (hicpy.*, generator, fits, the cross-check script's verdicts)
#   pipeline    generate -> ROOT file -> uproot analysis -> closure,
#               fit validation, fit systematics (scripts/run_all.sh)
#   drift       every committed results/tables/*.json is regenerated and must
#               match (scripts/check_results_drift.py)
#
# The ROOT / PyROOT arms and the three-arm cross-check need the WSL2 `hic`
# environment (conda-forge ROOT); they are deliberately not run here.
#
# History: until 2026-11-07 every run failed in the setup step, before any
# test ran -- `cache: pip` needs a dependency file and the repository had none
# (docs/troubleshooting.md #14).  A red CI badge that nobody reads is not a
# check; look at the run after every push.
name: ci

on:
  push:
  pull_request:

jobs:
  python-arm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: environment/requirements-ci.txt
      - name: Install the Python analysis stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r environment/requirements-ci.txt
          python -m pip freeze
      - name: Unit + pipeline tests
        run: python -m pytest -q
      - name: Full reproduction (uproot arm, closure, validation, systematics)
        # pytest already ran above; RECORD_ENV is unset, so the WSL2
        # environment record (environment/versions_installed.txt) is untouched
        run: RUN_TESTS=0 bash scripts/run_all.sh
      - name: Committed results must be reproduced
        run: |
          python scripts/check_results_drift.py
          git diff --stat -- results/figures
