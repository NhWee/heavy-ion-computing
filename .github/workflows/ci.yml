# Continuous integration: the part of the pipeline that runs without ROOT.
#
#   unit tests  (hicpy.kinematics, hicpy.toy_generator)
#   pipeline    generate -> ROOT file -> uproot analysis -> closure, small sample
#   full chain  scripts/run_all.sh with the committed config (ROOT arms skipped)
#
# The ROOT / PyROOT arms and the three-arm cross-check need the WSL2 `hic`
# environment (conda-forge ROOT); they are deliberately not run here.
name: ci

on:
  push:
  pull_request:

jobs:
  python-arm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the Python analysis stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "scipy>=1.11" "matplotlib>=3.8" \
            pyyaml "uproot>=5.3" "awkward>=2.6" pytest
      - name: Unit + pipeline tests
        run: python -m pytest -q
      - name: Full reproduction (uproot arm)
        run: bash scripts/run_all.sh
      - name: Results must not drift from the committed ones
        # Same seed, same code -> same JSON (up to the provenance block, which
        # records the machine) and the same figure bytes.
        run: |
          git diff --stat -- results/figures
          python - <<'EOF'
          import json, subprocess, sys
          new = json.load(open("results/tables/m01_fit_results.json"))
          old = json.loads(subprocess.check_output(
              ["git", "show", "HEAD:results/tables/m01_fit_results.json"]))
          for d in (new, old):
              d.pop("generator_provenance", None)
          def walk(a, b, path=""):
              if isinstance(a, dict):
                  assert a.keys() == b.keys(), (path, a.keys() ^ b.keys())
                  for k in a: walk(a[k], b[k], f"{path}/{k}")
              elif isinstance(a, list):
                  assert len(a) == len(b), path
                  for i, (x, y) in enumerate(zip(a, b)): walk(x, y, f"{path}[{i}]")
              elif isinstance(a, float):
                  assert abs(a - b) <= 1e-6 * max(abs(a), abs(b), 1e-300), (path, a, b)
              else:
                  assert a == b, (path, a, b)
          walk(new, old)
          print("committed results reproduced")
          EOF
